{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Academy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --page-bg: #f5f5f3;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #6b7280;
      --muted-light: #9ca3af;
      --border: #e7e7e6;
      --border-strong: #e5e7eb;
      --input-bg: #f9fafb;
      --input-border: #e5e7eb;
      --placeholder: #9aa0a6;
      --primary: #0056d2;
      --primary-hover: #00419e;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --error-border: #fecdd3;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.2rem 1rem 3rem;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.6rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.015em;
    }
    .brand img { width: 148px; height: auto; display: block; }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px 28px 22px;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06);
      position: relative;
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }
    .card-header-text { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1.42rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: #0b1220;
      margin-bottom: 0.3rem;
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }
    /* Language switch */
    .lang-switch {
      display: flex;
      gap: 2px;
      background: #f3f4f6;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 2px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .lang-switch button {
      border: 1px solid transparent;
      background: transparent;
      font: 700 0.62rem 'Inter', sans-serif;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
    }
    .lang-switch button.active {
      background: #fff;
      color: #0f172a;
      border-color: var(--border-strong);
      box-shadow: 0 1px 2px rgba(16,24,40,0.08);
    }
    .lang-switch button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* OAuth buttons */
    .oauth-stack { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.9rem; }
    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.52rem 0.75rem;
      background: #f9fafb;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      color: #1f2937;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .oauth-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .oauth-btn:active { background: #eef2f7; }
    .oauth-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin: 0.85rem 0 1rem;
      color: var(--muted-light);
      font-size: 0.72rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-strong);
    }
    /* Fields */
    .field { display: flex; flex-direction: column; gap: 0.32rem; margin-bottom: 0.85rem; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .field label { font-size: 0.72rem; font-weight: 600; color: #1f2937; }
    .field label .req { color: #ef4444; margin-left: 2px; }
    .forgot-link { font-size: 0.68rem; font-weight: 500; color: #4b5563; text-decoration: none; }
    .forgot-link:hover { color: var(--text); text-decoration: underline; }
    .field input[type=text],
    .field input[type=email],
    .field input[type=password] {
      width: 100%;
      padding: 0.48rem 0.65rem;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background: var(--input-bg);
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field input::placeholder { color: var(--placeholder); }
    .field input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,86,210,0.12);
    }
    .hint { font-size: 0.7rem; line-height: 1.5; color: var(--muted); margin-top: 0.1rem; }
    .field .errors { font-size: 0.72rem; color: var(--error); margin-top: 0.15rem; }
    .form-errors {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 4px;
      padding: 0.6rem 0.85rem;
      margin-bottom: 1rem;
      font-size: 0.78rem;
      color: #be123c;
      line-height: 1.5;
    }
    /* Password wrapper */
    .password-wrap { position: relative; display: flex; align-items: center; }
    .password-wrap input { padding-right: 2.1rem !important; }
    .eye-btn {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem;
      border-radius: 3px;
    }
    .eye-btn:hover { color: var(--muted); background: #f3f4f6; }
    .eye-btn svg { width: 15px; height: 15px; }
    /* Row for first/last name */
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 480px) {
      .card { padding: 22px 18px 18px; }
      .row { grid-template-columns: 1fr; }
      body { padding: 1.5rem 0.75rem 2rem; }
    }
    /* Check row */
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.15rem 0 0.9rem;
    }
    .check-field { display: flex; align-items: center; gap: 0.4rem; }
    .check-field input[type=checkbox] { width: 0.9rem; height: 0.9rem; accent-color: var(--primary); cursor: pointer; }
    .check-field label { font-size: 0.72rem; font-weight: 500; color: var(--text); cursor: pointer; }
    /* Primary button */
    .btn {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.55rem;
      letter-spacing: 0.01em;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { opacity: 0.92; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    /* Footer */
    .card-footer {
      margin-top: 1.15rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .card-footer a { color: #0f172a; text-decoration: none; font-weight: 600; }
    .card-footer a:hover { text-decoration: underline; }
    /* Messages */
    .messages { position: fixed; top: 1.1rem; right: 1.1rem; z-index: 999; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
    .message {
      padding: 0.65rem 0.95rem; font-size: 0.8rem; border-left: 3px solid;
      background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-radius: 6px;
      display: flex; align-items: center; gap: 0.6rem; animation: slideIn 0.2s ease both;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .message { animation: none; } }
    .message.success { border-color: var(--primary); color: #166534; }
    .message.error { border-color: var(--error); color: #991b1b; }
    .message.info { border-color: #0a66ff; color: #1e40af; }
    .message .close { margin-left: auto; cursor: pointer; opacity: 0.5; background: none; border: none; font-size: 0.9rem; line-height: 1; color: inherit; }
    .message .close:hover { opacity: 1; }
  </style>
</head>
<body>
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="message {{ message.tags }}">
      {{ message }}
      <button class="close" onclick="this.parentElement.remove()" aria-label="Close">✕</button>
    </div>
    {% endfor %}
  </div>
  <script>
    document.querySelectorAll('.message').forEach(el => {
      setTimeout(() => { el.style.opacity = '0'; }, 3800);
      setTimeout(() => el.remove(), 4200);
    });
  </script>
  {% endif %}

  <a class="brand" href="/"><img src="{% static 'images/logo.png' %}" alt="Academy"></a>

  <div class="card">{% block content %}{% endblock %}</div>

  <script>
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.eye-btn');
      if (!btn) return;
      var wrap = btn.closest('.password-wrap');
      if (!wrap) return;
      var input = wrap.querySelector('input');
      if (!input) return;
      var isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
      var eyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/></svg>';
      var eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.86 19.86 0 0 1 5.08-5.9M9.53 9.53A3.2 3.2 0 0 0 12 15.2a3.2 3.2 0 0 0 3.47-3.47"/><path d="M1 1l22 22"/></svg>';
      btn.innerHTML = isPw ? eyeOff : eyeOpen;
    });
  </script>
  <script src="{% static 'js/i18n.js' %}"></script>
</body>
</html>
