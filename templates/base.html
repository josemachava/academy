{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Academy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --input-border: #e3e6ea;
      --placeholder: #9ca3af;
      --primary: #0a66ff;
      --primary-hover: #0057e0;
      --error: #e11d48;
      --success: #15803d;
      --radius-card: 12px;
      --radius-input: 6px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .brand img { width: 180px; height: auto; }
    .card {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 2.5rem 2.5rem 1.75rem;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    }
    .card-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.35rem;
      color: #0f172a;
    }
    .card-sub {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.25rem 1.5rem; }
      .row { grid-template-columns: 1fr; }
    }
    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .field label { font-size: 0.875rem; font-weight: 600; color: var(--text); }
    .field label .req { color: #ef4444; margin-left: 2px; font-weight: 600; }
    .field input[type=text],
    .field input[type=email],
    .field input[type=password] {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-input);
      background: #fff;
      font-family: inherit;
      font-size: 0.8125rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input::placeholder { color: var(--placeholder); }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10,102,255,0.12);
    }
    .hint { font-size: 0.8125rem; line-height: 1.5; color: var(--muted); margin-top: 0.15rem; }
    .field .errors { font-size: 0.8rem; color: var(--error); }
    .form-errors {
      background: #fef2f2;
      border: 1px solid #fecdd3;
      border-radius: var(--radius-input);
      padding: 0.7rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      color: #be123c;
    }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.1rem 0 1.25rem;
    }
    .check-field { display: flex; align-items: center; gap: 0.5rem; }
    .check-field input[type=checkbox] {
      width: 1rem; height: 1rem; accent-color: var(--primary); cursor: pointer;
    }
    .check-field label { font-size: 0.875rem; font-weight: 400; color: var(--text); cursor: pointer; }
    .link { color: var(--primary); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    .link:hover { text-decoration: underline; }
    .btn {
      width: 100%;
      padding: 0.55rem 1rem;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-input);
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.35rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: scale(0.99); }
    .card-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .card-footer a { color: var(--primary); text-decoration: none; font-weight: 400; }
    .card-footer a:hover { text-decoration: underline; }
    .messages { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 999; display: flex; flex-direction: column; gap: 0.6rem; max-width: 340px; }
    .message {
      padding: 0.75rem 1.1rem; font-size: 0.875rem; border-left: 3px solid;
      background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.1); border-radius: 6px;
      display: flex; align-items: center; gap: 0.75rem; animation: slideIn 0.25s ease both;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .message.success { border-color: var(--success); color: var(--success); }
    .message.error { border-color: var(--error); color: var(--error); }
    .message.info { border-color: var(--primary); color: var(--primary); }
    .message .close { margin-left: auto; cursor: pointer; opacity: 0.5; background: none; border: none; font-size: 1rem; line-height: 1; }
    .message .close:hover { opacity: 1; }
  </style>
</head>
<body>
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="message {{ message.tags }}">
      {{ message }}
      <button class="close" onclick="this.parentElement.remove()">✕</button>
    </div>
    {% endfor %}
  </div>
  <script>
    document.querySelectorAll('.message').forEach(el => {
      setTimeout(() => { el.style.opacity = '0'; }, 4000);
      setTimeout(() => el.remove(), 4400);
    });
  </script>
  {% endif %}

  <a class="brand" href="/"><img src="{% static 'images/logo.png' %}" alt="Academy"></a>

  <div class="card">{% block content %}{% endblock %}</div>
</body>
</html>
